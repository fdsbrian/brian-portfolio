backend:
  name: github
  repo: fdsbrian/brian-portfolio
  branch: main

# Enables Decap CMS editing through npx decap-server during local development.
local_backend: true

# Uploaded files are stored in this repository folder.
media_folder: public/uploads

# Production URL used by pages hosted under the GitHub repository path.
public_folder: /brian-portfolio/uploads

# Enables Draft, In Review, and Ready publishing stages.
publish_mode: editorial_workflow

collections:
  # =========================================================
  # PROJECTS
  # =========================================================
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} · {{year}}"

    sortable_fields:
      - order
      - title
      - year

    fields:
      - label: Title
        name: title
        widget: string

      - label: Category
        name: category
        widget: string

      - label: Year
        name: year
        widget: string

      - label: Summary
        name: summary
        widget: text

      - label: Cover Image
        name: cover
        widget: image
        required: false

      - label: Cover Image Alternative Text
        name: coverAlt
        widget: string
        required: false
        hint: Describe the image for accessibility.

      - label: Featured Project
        name: featured
        widget: boolean
        default: false

      - label: Display Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1

      - label: Challenge
        name: challenge
        widget: text

      - label: Approach
        name: approach
        widget: text

      - label: Outcome
        name: outcome
        widget: text

      - label: Case Study Content
        name: body
        widget: markdown
        required: false

  # =========================================================
  # RESOURCES
  # =========================================================
  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} · {{type}}"

    sortable_fields:
      - order
      - title
      - type

    fields:
      - label: Title
        name: title
        widget: string

      - label: Type
        name: type
        widget: select
        options:
          - Article
          - Guide
          - Template
          - Checklist
          - Presentation
          - Download

      - label: Description
        name: description
        widget: text

      - label: Cover Image
        name: cover
        widget: image
        required: false

      - label: Downloadable File
        name: file
        widget: file
        required: false

      - label: Published
        name: published
        widget: boolean
        default: true

      - label: Display Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1

      - label: Resource Content
        name: body
        widget: markdown
        required: false

  # =========================================================
  # WEBSITE CONTENT
  # =========================================================
  - name: website
    label: Website Content

    files:
      # -----------------------------------------------------
      # GENERAL, HERO, CONTACT, FOOTER AND SEO
      # -----------------------------------------------------
      - label: General and Hero
        name: site
        file: src/data/site.json

        fields:
          - label: Name
            name: name
            widget: string

          - label: Professional Role
            name: role
            widget: string

          - label: Location
            name: location
            widget: string

          - label: Hero Eyebrow
            name: heroEyebrow
            widget: string

          - label: Hero First Line
            name: heroLine1
            widget: string

          - label: Hero Highlight
            name: heroAccent
            widget: string

          - label: Hero Final Line
            name: heroLine2
            widget: string

          - label: Hero Introduction
            name: heroBody
            widget: text

          - label: Primary Button Text
            name: heroPrimaryLabel
            widget: string

          - label: Secondary Button Text
            name: heroSecondaryLabel
            widget: string

          - label: Availability
            name: availability
            widget: string

          - label: Email
            name: email
            widget: string

          - label: LinkedIn URL
            name: linkedin
            widget: string
            required: false

          - label: GitHub URL
            name: github
            widget: string
            required: false

          - label: Résumé PDF
            name: resume
            widget: file
            required: false

          - label: Footer Eyebrow
            name: footerEyebrow
            widget: string

          - label: Footer Heading
            name: footerTitle
            widget: string

          - label: SEO Title
            name: seoTitle
            widget: string

          - label: SEO Description
            name: seoDescription
            widget: text

          - label: Social Sharing Image
            name: seoImage
            widget: image
            required: false

      # -----------------------------------------------------
      # ABOUT, EXPERIENCE AND SKILLS
      # -----------------------------------------------------
      - label: About, Experience and Skills
        name: about
        file: src/data/about.json

        fields:
          - label: About Page Eyebrow
            name: eyebrow
            widget: string

          - label: Main Heading
            name: title
            widget: string

          - label: Highlighted Heading
            name: accent
            widget: string

          - label: Introduction
            name: introduction
            widget: text

          - label: About Description
            name: body
            widget: text

          - label: Profile Image
            name: profileImage
            widget: image
            required: false

          - label: Profile Image Alternative Text
            name: profileImageAlt
            widget: string
            required: false
            hint: Describe the profile image for accessibility.

          - label: Experience
            name: experience
            widget: list
            collapsed: false
            summary: "{{fields.period}} · {{fields.role}}"

            fields:
              - label: Period
                name: period
                widget: string

              - label: Role
                name: role
                widget: string

              - label: Company
                name: company
                widget: string

              - label: Location
                name: location
                widget: string
                required: false

              - label: Description
                name: description
                widget: text

          - label: Skills
            name: skills
            widget: list
            collapsed: false
            summary: "{{fields.name}} · {{fields.category}}"

            fields:
              - label: Skill
                name: name
                widget: string

              - label: Category
                name: category
                widget: select
                options:
                  - Design
                  - Strategy
                  - Development
                  - Tools
                  - Delivery

              - label: Show as Featured
                name: featured
                widget: boolean
                default: false