backend:
  name: github
  repo: fdsbrian/brian-portfolio
  branch: main

# Enables Decap CMS editing through npx decap-server during local development.
local_backend: true

# Uploaded files are stored in this repository folder.
media_folder: public/uploads

# Production URL used by pages hosted under the GitHub repository path.
public_folder: /brian-portfolio/uploads

# Enables Draft, In Review, and Ready publishing stages.
publish_mode: editorial_workflow

collections:
  # =========================================================
  # PROJECTS
  # =========================================================
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} · {{year}}"

    sortable_fields:
      - order
      - title
      - year

    fields:
      - label: Title
        name: title
        widget: string

      - label: Category
        name: category
        widget: string
      
      - label: Industry
        name: industry
        widget: string
        required: false

      - label: Role
        name: role
        widget: string
        required: false

      - label: Client
        name: client
        widget: string
        required: false
        hint: Use an anonymized client name when confidentiality applies.

      - label: Year
        name: year
        widget: string

      - label: Summary
        name: summary
        widget: text
      
      - label: SEO Title
        name: seoTitle
        widget: string
        required: false
        hint: Optional. Leave empty to use the project title automatically.

      - label: SEO Description
        name: seoDescription
        widget: text
        required: false
        hint: Optional. Leave empty to use the project summary automatically.

      - label: Social Sharing Image
        name: seoImage
        widget: image
        required: false
        hint: Optional. Leave empty to use the project cover image automatically.

      - label: Cover Image
        name: cover
        widget: image
        required: false

      - label: Cover Image Alternative Text
        name: coverAlt
        widget: string
        required: false
        hint: Describe the image for accessibility.
      
      - label: Project Hero Media Type
        name: heroMediaType
        widget: select
        default: none
        options:
          - label: Use Existing Cover or Placeholder
            value: none
          - label: Background Image
            value: image
          - label: Background Video
            value: video

      - label: Project Hero Background Image
        name: heroBackgroundImage
        widget: image
        required: false
        hint: Used when Project Hero Media Type is Background Image.

      - label: Project Hero Background Video
        name: heroBackgroundVideo
        widget: file
        required: false
        media_library:
          config:
            multiple: false
        hint: Upload a compressed MP4 or WebM background video.

      - label: Project Hero Video Poster
        name: heroVideoPoster
        widget: image
        required: false
        hint: Displayed before the project background video begins playing.

      - label: Project Hero Media Alternative Text
        name: heroMediaAlt
        widget: string
        required: false
        hint: Describe meaningful media. Leave empty when the media is decorative.

      - label: Project Hero Overlay Strength
        name: heroOverlay
        widget: number
        value_type: int
        min: 0
        max: 100
        step: 1
        default: 58

      - label: Featured Project
        name: featured
        widget: boolean
        default: false

      - label: Display Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1

      - label: Challenge
        name: challenge
        widget: text

      - label: Approach
        name: approach
        widget: text

      - label: Outcome
        name: outcome
        widget: text

      - label: Results
        name: results
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.label}}"

        fields:
          - label: Metric
            name: value
            widget: string

          - label: Label
            name: label
            widget: string

          - label: Description
            name: description
            widget: string
            required: false

      - label: Project Gallery
        name: gallery
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.caption}}"

        fields:
          - label: Image
            name: image
            widget: image

          - label: Alternative Text
            name: alt
            widget: string
            hint: Describe the image clearly for visitors using assistive technology.

          - label: Caption
            name: caption
            widget: string
            required: false

          - label: Layout
            name: layout
            widget: select
            default: full
            options:
              - label: Full Width
                value: full

              - label: Half Width
                value: half

      - label: Case Study Content
        name: body
        widget: markdown
        required: false

  # =========================================================
  # RESOURCES
  # =========================================================
  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} · {{type}}"

    sortable_fields:
      - order
      - title
      - type

    fields:
      - label: Title
        name: title
        widget: string

      - label: Type
        name: type
        widget: select
        options:
          - Article
          - Guide
          - Template
          - Checklist
          - Presentation
          - Download

      - label: Description
        name: description
        widget: text

      - label: SEO Title
        name: seoTitle
        widget: string
        required: false
        hint: Optional. Leave empty to use the resource title automatically.

      - label: SEO Description
        name: seoDescription
        widget: text
        required: false
        hint: Optional. Leave empty to use the resource description automatically.

      - label: Social Sharing Image
        name: seoImage
        widget: image
        required: false
        hint: Optional. Leave empty to use the resource cover image automatically.

      - label: Cover Image
        name: cover
        widget: image
        required: false

      - label: Downloadable File
        name: file
        widget: file
        required: false

      - label: Published
        name: published
        widget: boolean
        default: true

      - label: Display Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1

      - label: Resource Content
        name: body
        widget: markdown
        required: false

  # =========================================================
  # WEBSITE CONTENT
  # =========================================================
  - name: website
    label: Website Content

    files:
      # -----------------------------------------------------
      # GENERAL, HERO, CONTACT, FOOTER AND SEO
      # -----------------------------------------------------
      - label: General and Hero
        name: site
        file: src/data/site.json

        fields:
          - label: Name
            name: name
            widget: string

          - label: Professional Role
            name: role
            widget: string

          - label: Location
            name: location
            widget: string

          - label: Hero Eyebrow
            name: heroEyebrow
            widget: string

          - label: Hero First Line
            name: heroLine1
            widget: string

          - label: Hero Highlight
            name: heroAccent
            widget: string

          - label: Hero Final Line
            name: heroLine2
            widget: string

          - label: Hero Introduction
            name: heroBody
            widget: text

          - label: Primary Button Text
            name: heroPrimaryLabel
            widget: string

          - label: Secondary Button Text
            name: heroSecondaryLabel
            widget: string

          - label: Hero Media Type
            name: heroMediaType
            widget: select
            default: none
            options:
              - label: No Background Media
                value: none
              - label: Background Image
                value: image
              - label: Background Video
                value: video

          - label: Hero Background Image
            name: heroBackgroundImage
            widget: image
            required: false
            hint: Used when Hero Media Type is Background Image. Also acts as a fallback when video cannot play.

          - label: Hero Background Video
            name: heroBackgroundVideo
            widget: file
            required: false
            media_library:
              config:
                multiple: false
            hint: Upload a compressed MP4 or WebM background video without essential audio.

          - label: Hero Video Poster
            name: heroVideoPoster
            widget: image
            required: false
            hint: Displayed while the background video loads.

          - label: Hero Media Alternative Text
            name: heroMediaAlt
            widget: string
            required: false
            hint: Describe meaningful background imagery. Leave empty if the media is purely decorative.

          - label: Hero Overlay Strength
            name: heroOverlay
            widget: number
            value_type: int
            min: 0
            max: 100
            step: 1
            default: 62
            hint: Higher values make the text background darker.

          - label: Availability
            name: availability
            widget: string

          - label: Email
            name: email
            widget: string
          
          - label: Contact Form Endpoint
            name: formEndpoint
            widget: string
            required: false
            hint: Paste the Formspree endpoint, for example https://formspree.io/f/abcdefgh

          - label: LinkedIn URL
            name: linkedin
            widget: string
            required: false

          - label: GitHub URL
            name: github
            widget: string
            required: false

          - label: Résumé PDF
            name: resume
            widget: file
            required: false

          - label: Footer Eyebrow
            name: footerEyebrow
            widget: string

          - label: Footer Heading
            name: footerTitle
            widget: string

          - label: SEO Title
            name: seoTitle
            widget: string

          - label: SEO Description
            name: seoDescription
            widget: text

          - label: Social Sharing Image
            name: seoImage
            widget: image
            required: false
          
          - label: Featured Clients
            name: featuredClients
            widget: list
            required: false

            fields:
              - label: Client Name
                name: name
                widget: string

              - label: Client Logo
                name: logo
                widget: image
                required: false

              - label: Website URL
                name: url
                widget: string
                required: false

      # -----------------------------------------------------
      # ABOUT, EXPERIENCE AND SKILLS
      # -----------------------------------------------------
      - label: About, Experience and Skills
        name: about
        file: src/data/about.json

        fields:
          - label: About Page Eyebrow
            name: eyebrow
            widget: string

          - label: Main Heading
            name: title
            widget: string

          - label: Highlighted Heading
            name: accent
            widget: string

          - label: Introduction
            name: introduction
            widget: text

          - label: About Description
            name: body
            widget: text
          
          - label: Professional Summary
            name: professionalSummary
            widget: text

          - label: Design Philosophy
            name: designPhilosophy
            widget: text

          - label: Industries
            name: industries
            widget: list

            field:
              label: Industry
              name: industry
              widget: string

          - label: Achievements
            name: achievements
            widget: list

            fields:
              - label: Title
                name: title
                widget: string

              - label: Description
                name: description
                widget: text

          - label: Profile Image
            name: profileImage
            widget: image
            required: false

          - label: Profile Image Alternative Text
            name: profileImageAlt
            widget: string
            required: false
            hint: Describe the profile image for accessibility.

          - label: Experience
            name: experience
            widget: list
            collapsed: false
            summary: "{{fields.period}} · {{fields.role}}"

            fields:
              - label: Period
                name: period
                widget: string

              - label: Role
                name: role
                widget: string

              - label: Company
                name: company
                widget: string

              - label: Location
                name: location
                widget: string
                required: false

              - label: Description
                name: description
                widget: text

          - label: Skills
            name: skills
            widget: list
            collapsed: false
            summary: "{{fields.name}} · {{fields.category}}"

            fields:
              - label: Skill
                name: name
                widget: string

              - label: Category
                name: category
                widget: select
                options:
                  - Design
                  - Strategy
                  - Development
                  - Tools
                  - Delivery

              - label: Show as Featured
                name: featured
                widget: boolean
                default: false